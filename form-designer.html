<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formular-Designer · HR Portal Demo</title><style>
:root{font-family:system-ui,Segoe UI,Arial;color:#1b2440;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#070042;color:white;padding:25px max(25px,calc((100vw - 1150px)/2))}header a{color:#99e7ff}main{max-width:1150px;margin:auto;padding:28px 22px}h1{margin:0 0 8px}h2{margin-top:0;font-size:20px}.layout{display:grid;grid-template-columns:minmax(280px,370px) 1fr;gap:20px}.panel{background:#fff;border:1px solid #e1e6f0;border-radius:14px;padding:22px;margin-bottom:20px}label{display:grid;gap:6px;font-size:14px;margin:12px 0;font-weight:600}input,select,textarea{border:1px solid #c9d1e1;border-radius:9px;padding:10px;font:inherit;width:100%}button{border:0;background:#070042;color:white;padding:10px 14px;border-radius:8px;font-weight:600;cursor:pointer}button.secondary{background:#eef1f8;color:#070042}button:disabled{opacity:.5}button:focus-visible,a:focus-visible{outline:3px solid #79c7f1}.hint{font-size:13px;color:#6c7790}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.field{border:1px solid #dee3ee;border-radius:10px;padding:13px;margin:9px 0;display:flex;align-items:center;gap:12px;justify-content:space-between}.field strong{display:block}.danger{color:#9d1b39}.preview{border-top:1px solid #e3e7f0;padding-top:13px;margin-top:15px}.preview label{max-width:570px}#notice{margin:12px 0;color:#176a40;font-weight:650}@media(max-width:750px){.layout{grid-template-columns:1fr}}
</style></head><body><header><h1>Formular-Designer</h1><div>HR Workflow Portal · Testumgebung — <a href="./index.html">Zurück zum HR-Portal</a></div></header><main><p class="hint">Erstelle zusätzliche Felder für eine Vorgangsart. Die Demo speichert die Definitionen ausschließlich in diesem Browser. Standardfelder bleiben erhalten.</p><div class="layout"><section class="panel"><h2>Feld hinzufügen</h2><label>Vorgangsart<select id="type"><option>Neueinstellung</option><option>Arbeitszeitänderung</option><option>Versetzung</option><option>Austritt</option><option>Mitarbeitendenausweis</option><option>Fortbildungsantrag</option><option>Homeoffice-Antrag</option></select></label><form id="add"><label>Feldbezeichnung<input id="label" required maxlength="80" placeholder="z. B. Kostenstelle"></label><label>Feldtyp<select id="kind"><option value="text">Textfeld</option><option value="textarea">Mehrzeiliger Text</option><option value="number">Zahl</option><option value="date">Datum</option><option value="select">Auswahlliste</option><option value="checkbox">Kontrollkästchen</option></select></label><label>Auswahlmöglichkeiten (mit Semikolon trennen)<input id="options" placeholder="Ja; Nein; In Prüfung"></label><label class="row" style="display:flex"><input type="checkbox" id="required" style="width:auto"> Pflichtfeld</label><button type="submit">+ Feld hinzufügen</button></form><p id="notice" role="status"></p></section><section class="panel"><h2>Felder der Vorgangsart</h2><div id="fields"></div><h2>Live-Vorschau</h2><div class="preview" id="preview"></div></section></div></main><script>
(()=>{'use strict';const K='mw-hr-form-definitions-v1';const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const read=()=>{try{const v=JSON.parse(localStorage.getItem(K));return v&&typeof v==='object'?v:{}}catch{return {}}};let all=read();const save=()=>localStorage.setItem(K,JSON.stringify(all));const type=()=>$('#type').value;const fields=()=>all[type()]||[];function preview(f){const required=f.required?' required':'';if(f.kind==='checkbox')return '<label class="row"><input type="checkbox" style="width:auto" disabled> '+esc(f.label)+'</label>';if(f.kind==='textarea')return '<label>'+esc(f.label)+'<textarea disabled rows="2"></textarea></label>';if(f.kind==='select')return '<label>'+esc(f.label)+'<select disabled><option>Bitte wählen</option>'+f.options.map(x=>'<option>'+esc(x)+'</option>').join('')+'</select></label>';return '<label>'+esc(f.label)+(f.required?' *':'')+'<input disabled type="'+f.kind+'"'+required+'></label>'}function render(){const a=fields();$('#fields').innerHTML=a.length?a.map((f,i)=>'<div class="field"><div><strong>'+esc(f.label)+'</strong><span class="hint">'+esc(f.kind)+(f.required?' · Pflichtfeld':'')+'</span></div><div class="row"><button class="secondary" data-move="-1" data-i="'+i+'" '+(i===0?'disabled':'')+' aria-label="Nach oben">↑</button><button class="secondary" data-move="1" data-i="'+i+'" '+(i===a.length-1?'disabled':'')+' aria-label="Nach unten">↓</button><button class="secondary danger" data-delete="'+i+'">Entfernen</button></div></div>').join(''):'<p class="hint">Noch keine zusätzlichen Felder. Die Standardfelder sind im Portal bereits vorhanden.</p>';$('#preview').innerHTML=a.length?a.map(preview).join(''):'<p class="hint">Die Formularvorschau erscheint nach dem Hinzufügen eines Felds.</p>'}$('#type').onchange=render;$('#add').onsubmit=e=>{e.preventDefault();const label=$('#label').value.trim(),kind=$('#kind').value,options=$('#options').value.split(';').map(x=>x.trim()).filter(Boolean);if(!label)return;if(kind==='select'&&!options.length){$('#notice').textContent='Bitte mindestens eine Auswahlmöglichkeit eingeben.';return}const item={id:'field_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7),label,kind,required:$('#required').checked,options:kind==='select'?options:[]};all[type()]=[...fields(),item];save();$('#add').reset();$('#notice').textContent='Feld gespeichert und im HR-Portal verfügbar.';render()};$('#fields').onclick=e=>{const b=e.target.closest('button');if(!b)return;const a=fields().slice();if(b.hasAttribute('data-delete'))a.splice(Number(b.dataset.delete),1);else{const i=Number(b.dataset.i),j=i+Number(b.dataset.move);if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]}all[type()]=a;save();render()};render()})();
</script></body></html>
